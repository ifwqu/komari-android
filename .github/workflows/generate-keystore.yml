name: Generate Signing Keystore

# 手动触发一次，生成正式签名密钥（JKS）。
# 输出：base64 密钥串 + 口令，以及 keystore 构件。
# 请把输出的内容保存到仓库 Secrets（KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），
# 或直接复用本仓库 keystore/ 目录下的文件（本项目默认提交，用于个人测试分发场景）。

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS keystore and print to log
        run: |
          set -e
          SP=$(openssl rand -hex 12)
          keytool -genkeypair -v \
            -keystore komari-release.jks \
            -storepass "$SP" -keypass "$SP" \
            -alias komari -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Komari Android, OU=Mobile, O=Komari, C=CN"
          echo "================ KEYSTORE_B64 ================"
          base64 -w0 komari-release.jks
          echo ""
          echo "================ PASSWORDS ================"
          echo "KEYSTORE_PASSWORD=$SP"
          echo "KEY_ALIAS=komari"
          echo "KEY_PASSWORD=$SP"
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-release-keystore
          path: komari-release.jks
          if-no-files-found: error